server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Maksimalna velicina upload-a (dokumenti za konkursne prijave)
    client_max_body_size 20M;

    # API -> backend kontejner (bez CORS-a, sve je same-origin)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chatbot koristi LLM (Ollama) pa zahtevi mogu da traju duze
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Upload-ovani dokumenti koje servira backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (SPA) fallback - sve ostalo vodi na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
